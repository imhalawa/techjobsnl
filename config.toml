schema_version = 1
database_path = ".data/job-watch.sqlite3"

[scan]
concurrency = 4
timeout_seconds = 20
retry_count = 2
user_agent = "job-watch/0.1 (+local personal job research)"

[filters]
countries = ["NL"]
include_families = ["software", "platform", "sre", "data", "ml", "application-security"]
include_title_patterns = []
exclude_title_patterns = ["manager", "director", "product manager", "sales engineer", "support"]

[ui]
theme = "clean-dark"
unicode_icons = true

[ui.theme_overrides]

[keybindings]
scan = "r"
search = "/"
filter = "f"
toggle_applied = "a"
history = "h"
open = "o"
copy = "c"
help = "?"
quit = "q"

[[companies]]
id = "mollie"
name = "Mollie"
enabled = true
[companies.source]
strategy = "ashby"
board = "mollie"

[[companies]]
id = "booking-com"
name = "Booking.com"
enabled = true
[companies.source]
strategy = "jibe"
base_url = "https://jobs.booking.com"
client = "Booking.com"

[[companies]]
id = "ebay"
name = "eBay"
enabled = true
[companies.source]
strategy = "ebay"
listing_url = "https://jobs.ebayinc.com/us/en/jobs-in-netherlands"

[[companies]]
id = "airwallex"
name = "Airwallex"
enabled = true
[companies.source]
strategy = "ashby"
board = "airwallex"

[[companies]]
id = "rabobank"
name = "Rabobank"
enabled = false
[companies.source]
strategy = "unsupported"
reason = "official sources reject unattended access (HTTP 403)"
