name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
          - name: macOS
            runner: macos-15-intel
          - name: Windows
            runner: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust checks
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run offline tests
        run: cargo test --locked --all-targets
      - name: Build release binary
        run: cargo build --locked --release
      - name: Check repository contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh tests/makefile_test.sh
          sh tests/release_test.sh
      - name: Check Windows release scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bash tests/release_test.sh
          $installer = Get-Content scripts/install.ps1 -Raw
          $null = [scriptblock]::Create($installer)
          foreach ($message in @(
            "[1/6] Detected Windows",
            "[2/6] Downloading",
            "[3/6] Verifying SHA-256 checksum",
            "[4/6] Installing to",
            "[5/6] Configuring command discovery",
            "[6/6] Installation complete",
            "Config on first launch:"
          )) {
            if (-not $installer.Contains($message)) { throw "Windows installer is missing: $message" }
          }
          $null = [scriptblock]::Create((Get-Content scripts/uninstall.ps1 -Raw))
          $testInstallDir = Join-Path $env:RUNNER_TEMP ("techjobsnl-uninstall-test-" + [guid]::NewGuid())
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          try {
            New-Item -ItemType Directory -Force $testInstallDir | Out-Null
            Set-Content (Join-Path $testInstallDir "techjobsnl.exe") "test"
            $testUserPath = if ($originalUserPath) { "$originalUserPath;$testInstallDir" } else { $testInstallDir }
            [Environment]::SetEnvironmentVariable("Path", $testUserPath, "User")
            & scripts/uninstall.ps1 -InstallDir $testInstallDir
            if (Test-Path (Join-Path $testInstallDir "techjobsnl.exe")) {
              throw "Windows uninstaller did not remove techjobsnl.exe"
            }
            $remainingUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if (($remainingUserPath -split ";") | Where-Object { $_.TrimEnd([char]'\') -ieq $testInstallDir.TrimEnd([char]'\') }) {
              throw "Windows uninstaller did not remove test install directory from user PATH"
            }
          } finally {
            [Environment]::SetEnvironmentVariable("Path", $originalUserPath, "User")
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $testInstallDir
          }
