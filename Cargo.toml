[package]
name = "techjobsnl"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/imhalawa/techjobsnl"
readme = "README.md"

[lib]
name = "job_watch"
path = "src/lib.rs"

[[bin]]
name = "techjobsnl"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
opener = "0.8.5"
quick-xml = { version = "0.39", features = ["serialize"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "cookies", "gzip", "json", "rustls", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
