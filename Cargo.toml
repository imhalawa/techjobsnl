[package]
name = "job-watch"
version = "0.1.0"
edition = "2024"

[lib]
name = "job_watch"
path = "src/lib.rs"

[[bin]]
name = "job-watch"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
opener = "0.8.5"
ratatui = "0.30.2"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "cookies", "gzip", "json", "rustls", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
